services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_mo_phong_backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3000
      PERMISSION_SERVICE_URL: http://host.docker.internal:3001
      LEARNING_DATASET_PATH: /data/all-in-one.learning-data.json
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - ../database/data:/data:ro
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: base_web_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ai_mo_phong}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/migrations:/migrations:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  backend_node_modules:
  postgres_data:
